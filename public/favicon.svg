<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- 深邃科技黑蓝底渐变 -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c1a2e"/>
      <stop offset="50%" stop-color="#08101e"/>
      <stop offset="100%" stop-color="#040812"/>
    </linearGradient>
    
    <!-- 精致微边框渐变 -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00e5ff" stop-opacity="0.6"/>
      <stop offset="40%" stop-color="#00b3f9" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#0055b3" stop-opacity="0.1"/>
    </linearGradient>

    <!-- 品牌电光青蓝渐变 -->
    <linearGradient id="brandCyan" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38e1ff"/>
      <stop offset="50%" stop-color="#00b3f9"/>
      <stop offset="100%" stop-color="#0084f5"/>
    </linearGradient>

    <!-- 科技微辉光滤镜 -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="10" flood-color="#00b3f9" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- 外部圆角底板 (iOS squircle / 现代圆角) -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#bgGrad)"/>
  <rect x="16" y="16" width="480" height="480" rx="112" fill="none" stroke="url(#borderGrad)" stroke-width="4"/>

